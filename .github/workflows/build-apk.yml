name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java Major Version: $JAVA_VER"

          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect Java version."
            exit 1
          fi

          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Found: $JAVA_VER"
            exit 1
          fi
          echo "Java environment verification successful."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking / Generating Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Built APK ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$TARGET_APK" ] && [ -s "$TARGET_APK" ]; then
            echo "APK verified successfully: $TARGET_APK"
            ls -lh "$TARGET_APK"
          else
            echo "ERROR: Target APK $TARGET_APK is missing or empty!"
            echo "Searching in app/build/outputs/apk/..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          if [ ! -f "$TMP_DIR/app-debug.apk" ] || [ ! -s "$TMP_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare release asset."
            exit 1
          fi
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared at: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_FILE="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Prepared APK is missing or empty: $ASSET_FILE"
            exit 1
          fi

          FILENAME=$(basename "$ASSET_FILE")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk, found: $FILENAME"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_FILE" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "### 🤖 Automated Debug APK Build

- **Build Run:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
- **Source Commit:** \`${{ github.sha }}\`
- **Notice:** This is an automatically generated debug APK intended for testing purposes. It is signed with a temporary debug keystore and is not a Play Store production release." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release successfully created:"
            gh release view "$TAG_NAME" || true
            
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            
            echo "### 📱 DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct download link for **app-debug.apk** (Backup artifact \`app-debug-apk\` is also available)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK was built successfully and is preserved as GitHub Actions artifact: app-debug-apk"
            echo "### ⚠️ Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions artifact \`app-debug-apk\` is available for download in the Actions tab." >> "$GITHUB_STEP_SUMMARY"
          fi
